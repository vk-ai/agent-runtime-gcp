# Local stack: Postgres (checkpoints + memory store) and the API.
#   docker compose up --build
# Optional observability (OTel Collector -> Prometheus -> Grafana on :3000):
#   docker compose --profile observability up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentrt
      POSTGRES_PASSWORD: agentrt
      POSTGRES_DB: agentrt
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentrt"]
      interval: 2s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    build: .
    environment:
      PORT: "8080"
      AGENTRT_PERSISTENCE: postgres
      AGENTRT_PG_DSN: postgresql://agentrt:agentrt@postgres:5432/agentrt
      AGENTRT_OTEL: ${AGENTRT_OTEL:-console}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      AGENTRT_OTEL_INTERVAL_MS: "5000"
      # Uncomment to put a real OpenAI-compatible provider in front of the mocks:
      # OPENAI_BASE_URL: https://api.openai.com/v1
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  pgdata: {}
