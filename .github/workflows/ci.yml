name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + integration tests (in-memory and SQLite, no network)
        run: pytest -q --cov=agent_runtime --cov-report=term
      - name: Demo run
        run: python demo/run_demo.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentrt
          POSTGRES_PASSWORD: agentrt
          POSTGRES_DB: agentrt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentrt"
          --health-interval 2s --health-retries 20
    env:
      AGENTRT_PG_DSN: postgresql://agentrt:agentrt@localhost:5432/agentrt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Postgres checkpointer + store tests
        run: pytest -q -m postgres

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
